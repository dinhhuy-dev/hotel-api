name: CI

on:
  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
permissions:
  contents: read

# Cancel an older workflow when a newer commit is pushed
# to the same branch or pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality-check:
    name: Lint, Test and Build
    runs-on: ubuntu:latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint:check

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Build application
        run: npm run build

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            --tag nestjs-app:${{ github.sha }} \
            .

      - name: Inspect Docker image
        run: docker image inspect nestjs-app:${{ github.sha }}
